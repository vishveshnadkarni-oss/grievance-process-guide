<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grievance Process Guide</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1c2430; --mute:#667085; --line:#d9dee7; --brand:#0b5fff; --soft:#eef3ff;
  --start:#12805c; --action:#0b5fff; --decision:#b45309; --escalation:#b42318; --closure:#475467;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1319; --card:#171d26; --ink:#e6eaf0; --mute:#9aa4b2; --line:#2a3340; --brand:#5b9bff; --soft:#1b2638;
    --start:#34c38f; --action:#5b9bff; --decision:#f0a24b; --escalation:#f4796b; --closure:#98a2b3;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:18px}
.brand .sub{font-size:12px;color:var(--mute)}
nav{display:flex;gap:4px}
nav button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.srch{position:relative;flex:1;min-width:180px;max-width:340px}
.srch input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#results{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;max-height:300px;overflow:auto}
#results button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 12px;cursor:pointer;font:inherit;border-bottom:1px solid var(--line)}
#results button:last-child{border-bottom:0}
#results button:hover{background:var(--soft)}
#results .none{padding:10px 12px;color:var(--mute)}
#tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--escalation);border-color:var(--escalation)}
#banner{background:#fff4d6;color:#6b4a00;padding:8px 16px;font-size:13px;border-bottom:1px solid #f0d58a}
@media (prefers-color-scheme: dark){#banner{background:#3a2f10;color:#f3d48a;border-color:#5a4817}}
#layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;align-items:start}
body[data-view="walk"]:not([data-edit="1"]) #layout{grid-template-columns:minmax(0,1fr);max-width:860px;margin:0 auto}
body[data-view="walk"]:not([data-edit="1"]) #panel{display:none}
@media (max-width:900px){#layout{grid-template-columns:minmax(0,1fr)}}
#panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){#panel{position:static;max-height:none}}
.empty,.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff;background:var(--c,var(--action))}
.t-start{--c:var(--start)} .t-action{--c:var(--action)} .t-decision{--c:var(--decision)} .t-escalation{--c:var(--escalation)} .t-closure{--c:var(--closure)}
.card h2,#panel h2{margin:10px 0 8px;font-size:21px;line-height:1.3}
.todo{background:#fff4d6;color:#6b4a00;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
@media (prefers-color-scheme: dark){.todo{background:#3a2f10;color:#f3d48a}}
.f{margin:12px 0}
.fl{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.fv{white-space:pre-wrap}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.crumbs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:last-child{background:var(--soft);border-color:var(--brand)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.choices .btn{text-align:left;padding:11px 14px}
.choices select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.end{margin-top:18px;padding:12px;border-radius:8px;background:var(--soft);color:var(--mute)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
#mapwrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 170px);min-height:320px}
svg text{font-family:inherit;fill:var(--ink)}
.node{cursor:pointer}
.node rect.box{fill:var(--card);stroke:var(--c);stroke-width:1.5}
.node rect.bar{fill:var(--c)}
.node.ph rect.box{stroke-dasharray:5 4}
.node.onpath rect.box{fill:var(--soft);stroke-width:2.5}
.node.sel rect.box{stroke-width:3.5}
.node .tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;fill:var(--c)}
.node .ttl{font-size:13px;font-weight:600}
.edge{fill:none;stroke:var(--mute);stroke-width:1.4}
.edge.onpath{stroke:var(--brand);stroke-width:2.4}
.elabel{font-size:11px;fill:var(--mute);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.edgeform .edge{display:grid;grid-template-columns:1fr 1fr auto auto;gap:4px;margin-bottom:6px}
#panel label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
#panel input[type=text],#panel input:not([type]),#panel select,#panel textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#panel textarea{min-height:76px;resize:vertical}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;padding:0 9px}
.link{border:0;background:none;color:var(--brand);cursor:pointer;font:inherit;padding:2px 0;text-align:left}
ul.nx{margin:6px 0 0;padding-left:18px}
footer{padding:8px 16px 24px;text-align:center;font-size:12px;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
  <nav id="tabs"></nav>
  <div class="srch"><input id="search" type="search" placeholder="Search steps..." autocomplete="off"><div id="results"></div></div>
  <div id="tools"></div>
</header>
<div id="banner" hidden></div>
<div id="layout"><main id="main"></main><aside id="panel"></aside></div>
<footer id="foot"></footer>
<input type="file" id="importFile" accept=".js,.json,.txt" hidden>
<script src="flow.js"></script>
<script src="app.js"></script>
</body>
</html>
